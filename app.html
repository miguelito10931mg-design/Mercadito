const App = (() => {
  const state = {
    view:'home',
    stack:[],
    location:{ city:'Veracruz', colony:'Fraccionamiento Río Medio 3' },
    filters:{ categorySort:'rating' }
  };

  function toast(msg, ms=2400){
    const t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(t._t);
    t._t = setTimeout(()=>t.classList.add('hidden'), ms);
  }
  function openModal(html){
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modal').classList.remove('hidden');
  }
  function closeModal(){ document.getElementById('modal').classList.add('hidden'); }
  function showLoading(){ document.getElementById('loadingOverlay').classList.remove('hidden'); }
  function hideLoading(){ document.getElementById('loadingOverlay').classList.add('hidden'); }

  function navigate(view, opts={}){
    state.view = view;
    state.stack = opts.stack || [];
    if(view !== 'search'){
      const inp = document.getElementById('globalSearch');
      if(inp){ inp.value = ''; toggleClearBtn(false); }
    }
    render();
    window.scrollTo(0,0);
    updateNav();
  }
  function toggleClearBtn(show){
    const b = document.getElementById('clearSearch');
    if(b) b.classList.toggle('hidden', !show);
  }
  function updateNav(){
    document.querySelectorAll('.nav-item').forEach(b=>{
      b.classList.toggle('active', b.dataset.view === state.view);
    });
  }
  function render(){
    const main = document.getElementById('appMain');
    switch(state.view){
      case 'home': main.innerHTML = Views.home(); break;
      case 'categories': main.innerHTML = Views.categories(); break;
      case 'category': main.innerHTML = Views.category(state.stack[0]); break;
      case 'business': main.innerHTML = Views.business(state.stack[0]); break;
      case 'cart': main.innerHTML = Views.cart(); break;
      case 'search': main.innerHTML = Views.search(); break;
      case 'account': main.innerHTML = Views.account(); break;
      case 'orders': main.innerHTML = Views.orders(); break;
      case 'favorites': main.innerHTML = Views.favorites(); break;
      case 'vendor': main.innerHTML = Views.vendorPanel(); break;
      case 'admin': main.innerHTML = Views.admin(); break;
      default: main.innerHTML = Views.home();
    }
    Cart.updateBadge();
    Notifications.updateBadge();
    setTimeout(initCarousel, 60);
    setTimeout(()=>{
      if(typeof ImageUtils.setup === 'function'){
        ImageUtils.setup('vLogoEdit');
        ImageUtils.setup('vCoverEdit');
      }
    }, 80);
  }

  async function init(){
    ImageUtils.setMessageHandler((msg) => toast(msg));

    try {
      const profile = await Auth.init();
      if(!profile) return;

      await DB.loadAll();

      const params = new URLSearchParams(window.location.search);
      const initialView = params.get('view');
      if(initialView && ['home','vendor','orders','favorites','account','cart','admin'].includes(initialView)){
        state.view = initialView;
      }
    } catch(e){
      console.error('Init error:', e);
    }

    setTimeout(()=>{
      const splash = document.getElementById('splash');
      if(splash) splash.classList.add('hide');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('locationText').textContent = state.location.colony;
      render();
      updateNav();
    }, 700);

    document.querySelectorAll('.nav-item').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const v = btn.dataset.view;
        const inp = document.getElementById('globalSearch');
        if(v !== 'search' && inp){ inp.value=''; toggleClearBtn(false); }
        if(v === 'search' && inp){
          inp.value=''; toggleClearBtn(false);
          navigate('search');
          setTimeout(()=>inp.focus(), 120);
          return;
        }
        navigate(v);
      });
    });

    const searchInput = document.getElementById('globalSearch');
    const searchBar = document.getElementById('searchBar');
    const clearBtn = document.getElementById('clearSearch');

    searchBar.addEventListener('click', e=>{
      if(state.view !== 'search') navigate('search');
      if(e.target !== searchInput) setTimeout(()=>searchInput.focus(), 50);
    });
    let searchTimer;
    searchInput.addEventListener('input', e=>{
      const q = e.target.value.trim().toLowerCase();
      toggleClearBtn(!!q);
      if(state.view !== 'search') navigate('search');
      clearTimeout(searchTimer);
      searchTimer = setTimeout(()=>{
        const res = document.getElementById('searchResults');
        if(!res) return;
        if(!q){ res.innerHTML = Views.searchEmpty(); return; }
        Categories.renderSearch(res, q);
      }, 200);
    });
    searchInput.addEventListener('focus', ()=>{
      if(state.view !== 'search') navigate('search');
    });
    clearBtn.addEventListener('click', e=>{
      e.stopPropagation();
      searchInput.value = '';
      toggleClearBtn(false);
      searchInput.focus();
      const res = document.getElementById('searchResults');
      if(res) res.innerHTML = Views.searchEmpty();
    });

    document.getElementById('locationBtn').addEventListener('click', showLocationModal);
    document.getElementById('notifBtn').addEventListener('click', ()=> Notifications.openCenter());
    document.getElementById('modal').addEventListener('click', e=>{
      if(e.target.hasAttribute('data-close-modal')) closeModal();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
    });

    if ('serviceWorker' in navigator) {
      try {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      } catch(e) {}
    }
  }

  function showLocationModal(){
    const current = state.location.colony;
    openModal(`
      <h3>📍 Selecciona tu fraccionamiento</h3>
      <p>Verás los negocios de esta zona. Podrás cambiarla cuando quieras.</p>
      <div class="form-group">
        <label>Zona</label>
        <select id="colonySel">${ZONE_NAMES.map(z => `<option ${z===current?'selected':''}>${esc(z)}</option>`).join('')}</select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close-modal>Cancelar</button>
        <button class="btn btn-primary" id="saveLoc">Guardar</button>
      </div>
    `);
    document.getElementById('saveLoc').onclick = ()=>{
      state.location = { city:'Veracruz', colony: document.getElementById('colonySel').value };
      document.getElementById('locationText').textContent = state.location.colony;
      // ✅ El carrito NO se vacía al cambiar de zona
      closeModal();
      render();
      toast('📍 Ubicación actualizada');
    };
  }

  return { init, navigate, render, state, toast, openModal, closeModal, showLoading, hideLoading, updateNav };
})();

/* ============================================================
   CARRUSEL
   ============================================================ */
let _carouselTimer = null;
let _carouselIdx = 0;
let _touchStartX = 0;
let _goToSlideFn = null;

function initCarousel(){
  clearInterval(_carouselTimer);
  const track = document.getElementById('carouselTrack');
  if(!track) { _goToSlideFn = null; return; }
  const slides = track.querySelectorAll('.promo-slide');
  if(slides.length <= 1) { _goToSlideFn = null; return; }
  _carouselIdx = 0;
  track.style.transform = 'translateX(0)';
  const total = slides.length;
  const dots = document.querySelectorAll('.promo-dot');
  function render(){
    track.style.transform = `translateX(-${_carouselIdx * 100}%)`;
    dots.forEach((d,i)=>d.classList.toggle('active', i === _carouselIdx));
  }
  _goToSlideFn = (i) => { _carouselIdx = i; render(); restart(); };
  function next(){ _carouselIdx = (_carouselIdx + 1) % total; render(); }
  function restart(){ clearInterval(_carouselTimer); _carouselTimer = setInterval(next, 4000); }
  if(!track._carouselBound){
    track.addEventListener('touchstart', e=>{ _touchStartX = e.touches[0].clientX; }, {passive:true});
    track.addEventListener('touchend', e=>{
      const dx = e.changedTouches[0].clientX - _touchStartX;
      if(Math.abs(dx) < 40) return;
      const t = track.querySelectorAll('.promo-slide').length;
      if(t <= 1) return;
      if(dx < 0) _carouselIdx = (_carouselIdx + 1) % t;
      else _carouselIdx = (_carouselIdx - 1 + t) % t;
      render(); restart();
    }, {passive:true});
    track.addEventListener('mouseenter', ()=> clearInterval(_carouselTimer));
    track.addEventListener('mouseleave', restart);
    track._carouselBound = true;
  }
  restart();
}

/* ============================================================
   ROUTER GLOBAL DE CLICKS
   ============================================================ */
document.addEventListener('click', async e=>{
  const t = e.target;

  if(t.hasAttribute('data-close-modal')){ App.closeModal(); return; }

  // Handler del botón "Solicitar cambio de zona"
  if(t.id === 'requestZoneChange'){
    const v = Vendors.current();
    if(!v) return;
    const msg = `Hola, soy ${v.owner || v.ownerName} del negocio "${v.name}". Actualmente estoy en la zona "${v.colony}" y me gustaría cambiarme a otra zona. ¿Es posible?`;
    window.open(`https://wa.me/${ADMIN_WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank');
    return;
  }

  // ✅ Editar información del negocio
  if(t.id === 'editBizInfoBtn'){
    const v = Vendors.current();
    if(!v) return;
    App.openModal(`
      <h3>✏️ Editar información</h3>
      <div class="form-group"><label>Nombre del negocio</label><input id="edName" value="${esc(v.name)}" /></div>
      <div class="form-group"><label>Propietario</label><input id="edOwner" value="${esc(v.owner || v.ownerName || '')}" /></div>
      <div class="form-group"><label>WhatsApp</label><input id="edWa" value="${esc(v.whatsapp)}" /></div>
      <div class="form-group"><label>Dirección</label><input id="edAddr" value="${esc(v.address)}" /></div>
      <div class="form-group"><label>Horario (HH:MM - HH:MM)</label><input id="edSch" value="${esc(v.schedule || '10:00 - 22:00')}" /></div>
      <div class="form-group"><label>Descripción</label><textarea id="edDesc" rows="3">${esc(v.description)}</textarea></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close-modal>Cancelar</button>
        <button class="btn btn-primary" id="saveBizInfo">Guardar</button>
      </div>
    `);
    document.getElementById('saveBizInfo').onclick = async ()=>{
      const name = document.getElementById('edName').value.trim();
      const owner = document.getElementById('edOwner').value.trim();
      const wa = document.getElementById('edWa').value.replace(/\D/g,'');
      const addr = document.getElementById('edAddr').value.trim();
      const sch = document.getElementById('edSch').value.trim();
      const desc = document.getElementById('edDesc').value.trim();
      if(name.length < 3) return App.toast('❌ Nombre muy corto');
      if(owner.length < 3) return App.toast('❌ Propietario muy corto');
      if(!/^\d{10,15}$/.test(wa)) return App.toast('❌ WhatsApp inválido');
      if(addr.length < 5) return App.toast('❌ Dirección muy corta');
      if(!/^\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}$/.test(sch)) return App.toast('❌ Horario inválido (HH:MM - HH:MM)');
      if(desc.length < 15) return App.toast('❌ Descripción muy corta (mín. 15)');
      App.showLoading();
      try {
        await DB.update('businesses', v.id, {
          name, owner, ownerName: owner, whatsapp: wa, address: addr, schedule: sch, description: desc
        });
        await DB.loadAll();
        App.closeModal();
        App.toast('✅ Información actualizada');
        App.render();
      } catch(e){ App.toast('❌ ' + e.message); }
      finally { App.hideLoading(); }
    };
    return;
  }

  // Handler del botón "Guardar costos de envío"
  if(t.id === 'saveDeliveryCosts'){
    Vendors.saveDeliveryCosts();
    return;
  }

  const actBtn = t.closest('[data-action]');
  if(actBtn){
    const a = actBtn.dataset.action;
    if(a === 'admin-pending') Admin.openPendingBusinesses();
    else if(a === 'admin-promos') Promos.openList();
    else if(a === 'admin-coupons') Coupons.openAdminList();
    else if(a === 'admin-cat') Admin.openCategoryForm();
    else if(a === 'admin-biz') Admin.openAllBusinesses();
    else if(a === 'admin-feat') Admin.openFeatured();
    else if(a === 'admin-seed') Admin.seedDatabase();
    else if(a === 'push-notif') Notifications.requestPermission();
    return;
  }

  const ddec = t.closest('[data-ddec]');
  if(ddec){
    const val = document.getElementById('detailQtyVal');
    const p = DB.get('products').find(x=>x.id===ddec.dataset.ddec);
    const q = Math.max(1, +val.textContent - 1);
    val.textContent = q;
    const btn = document.getElementById('addFromDetail');
    if(btn && p) btn.innerHTML = `🛒 Agregar ${money(p.price * q)}`;
    return;
  }
  const dinc = t.closest('[data-dinc]');
  if(dinc){
    const val = document.getElementById('detailQtyVal');
    const p = DB.get('products').find(x=>x.id===dinc.dataset.dinc);
    const q = +val.textContent + 1;
    val.textContent = q;
    const btn = document.getElementById('addFromDetail');
    if(btn && p) btn.innerHTML = `🛒 Agregar ${money(p.price * q)}`;
    return;
  }

  const addMany = t.closest('[data-add-many]');
  if(addMany){
    const p = DB.get('products').find(x=>x.id===addMany.dataset.addMany);
    const q = +document.getElementById('detailQtyVal').textContent || 1;
    if(p){ Cart.add(p, q); App.closeModal(); App.render(); }
    return;
  }

  const addBtn = t.closest('[data-add]');
  if(addBtn){
    const p = DB.get('products').find(x=>x.id===addBtn.dataset.add);
    if(p){ Cart.add(p); App.render(); }
    return;
  }

  const incBtn = t.closest('[data-inc]');
  if(incBtn){ Cart.inc(incBtn.dataset.inc); App.render(); return; }
  const decBtn = t.closest('[data-dec]');
  if(decBtn){ Cart.dec(decBtn.dataset.dec); App.render(); return; }

  const openProd = t.closest('[data-open-product]');
  if(openProd){ Views.productDetail(openProd.dataset.openProduct); return; }

  const navBtn = t.closest('[data-nav]');
  if(navBtn){ App.navigate(navBtn.dataset.nav); return; }

  const catBtn = t.closest('[data-cat]');
  if(catBtn){ App.navigate('category', {stack:[catBtn.dataset.cat]}); return; }

  const dot = t.closest('[data-dot]');
  if(dot){ if(typeof _goToSlideFn === 'function') _goToSlideFn(+dot.dataset.dot); return; }

  const bizBtn = t.closest('[data-biz]');
  if(bizBtn){ App.navigate('business', {stack:[bizBtn.dataset.biz]}); return; }

  if(t.closest('[data-back]')){ App.navigate('home'); return; }

  const favBiz = t.closest('[data-fav-biz]');
  if(favBiz){ Auth.toggleFav('businesses', favBiz.dataset.favBiz); App.render(); return; }

  const revBiz = t.closest('[data-review-biz]');
  if(revBiz){ Reviews.openForm(revBiz.dataset.reviewBiz); return; }

  const ptab = t.closest('[data-ptab]');
  if(ptab){
    document.querySelectorAll('[data-ptab]').forEach(x=>x.classList.remove('active'));
    ptab.classList.add('active');
    const bizId = App.state.stack[0];
    const products = DB.get('products').filter(p=>p.businessId===bizId && p.active && p.category===ptab.dataset.ptab);
    document.getElementById('prodList').innerHTML = Views.renderProducts(products);
    return;
  }

  const sortBtn = t.closest('[data-sort]');
  if(sortBtn){ App.state.filters.categorySort = sortBtn.dataset.sort; App.render(); return; }

  const cancelOrder = t.closest('[data-cancel-order]');
  if(cancelOrder){
    const id = cancelOrder.dataset.cancelOrder;
    App.openModal(`
      <h3>❌ ¿Cancelar pedido?</h3>
      <p>Esta acción no se puede deshacer.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close-modal>No</button>
        <button class="btn btn-danger" id="confirmCancelOrder">Sí, cancelar</button>
      </div>
    `);
    document.getElementById('confirmCancelOrder').onclick = async ()=>{
      await Orders.updateStatus(id, 'cancelled');
      await DB.loadAll();
      App.closeModal();
      App.toast('❌ Pedido cancelado');
      App.render();
    };
    return;
  }

  const revOrder = t.closest('[data-review-order]');
  if(revOrder){
    const o = DB.get('orders').find(x => x.id === revOrder.dataset.reviewOrder);
    if(o) Reviews.openForm(o.businessId);
    return;
  }

  const reorder = t.closest('[data-reorder]');
  if(reorder){
    const o = DB.get('orders').find(x => x.id === reorder.dataset.reorder);
    if(!o) return;
    Cart.clear();
    const c = { businessId:o.businessId, items:[], coupon:null };
    o.items.forEach(i => c.items.push({...i}));
    // ✅ Guardar en la clave del usuario actual
    const uid = Auth.profile()?.uid || 'guest';
    localStorage.setItem(`mercadito_cart_v3_${uid}`, JSON.stringify(c));
    Cart.updateBadge();
    App.navigate('cart');
    App.toast('🛒 Pedido cargado');
    return;
  }

  const editPromo = t.closest('[data-edit-promo]');
  if(editPromo){ Promos.openForm(editPromo.dataset.editPromo); return; }
  const editCoupon = t.closest('[data-edit-coupon]');
  if(editCoupon){ Coupons.openForm(editCoupon.dataset.editCoupon); return; }

  const statusBtn = t.closest('[data-order-status]');
  if(statusBtn){
    const id = statusBtn.dataset.orderStatus;
    const newStatus = statusBtn.dataset.newStatus;
    const updated = await Orders.updateStatus(id, newStatus);
    if(updated){
      const msg = {
        preparing:'👨‍🍳 Preparando',
        onway:'🚚 En camino',
        delivered:'✅ Entregado',
        cancelled:'❌ Cancelado'
      }[newStatus] || 'Actualizado';
      Notifications.add({ title:`Pedido #${updated.number}`, body:msg, icon:'📦' });
      await DB.loadAll();
      App.toast(msg);
      App.render();
    }
    return;
  }

  const rmOrder = t.closest('[data-remove-order]');
  if(rmOrder){
    await DB.remove('orders', rmOrder.dataset.removeOrder);
    await DB.loadAll();
    App.toast('🗑️ Eliminado');
    App.render();
    return;
  }

  const waOrder = t.closest('[data-wa-order]');
  if(waOrder){
    const o = DB.get('orders').find(x => x.id === waOrder.dataset.waOrder);
    if(!o) return;
    const msg = `Hola${o.customer?.name ? ' ' + o.customer.name : ''}, sobre tu pedido #${o.number} en ${o.businessName}...`;
    const phone = (o.customer?.phone || '').replace(/\D/g,'');
    window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    return;
  }

  const approve = t.closest('[data-approve-biz]');
  if(approve){ Admin.approveBiz(approve.dataset.approveBiz); return; }
  const reject = t.closest('[data-reject-biz]');
  if(reject){ Admin.rejectBiz(reject.dataset.rejectBiz); return; }
  const suspend = t.closest('[data-suspend-biz]');
  if(suspend){ Admin.suspendBiz(suspend.dataset.suspendBiz); return; }
  const reactivate = t.closest('[data-reactivate-biz]');
  if(reactivate){ Admin.reactivateBiz(reactivate.dataset.reactivateBiz); return; }
  const viewBiz = t.closest('[data-view-biz]');
  if(viewBiz){ App.navigate('business', {stack:[viewBiz.dataset.viewBiz]}); return; }

  const feat = t.closest('[data-feat]');
  if(feat){
    const b = DB.get('businesses').find(x => x.id === feat.dataset.feat);
    if(b){
      await DB.update('businesses', b.id, { featured: !b.featured });
      await DB.loadAll();
      App.toast(!b.featured ? '⭐ Destacado' : '☆ Removido');
      Admin.openFeatured();
    }
    return;
  }

  if(t.id === 'saveBizImages'){
    const v = Vendors.current();
    if(!v) return;
    App.showLoading();
    try {
      let imageUrl = v.image || '';
      let coverUrl = v.coverImage || '';
      // ✅ Usar uid del usuario autenticado
      const uid = Auth.profile()?.uid || v.ownerId;
      if(ImageUtils.hasNewImage('vLogoEdit')){
        imageUrl = await ImageUtils.uploadToStorage(ImageUtils.getPendingBlob('vLogoEdit'), `businesses/${uid}/logo_${Date.now()}.webp`);
      }
      if(ImageUtils.hasNewImage('vCoverEdit')){
        coverUrl = await ImageUtils.uploadToStorage(ImageUtils.getPendingBlob('vCoverEdit'), `businesses/${uid}/cover_${Date.now()}.webp`);
      }
      await DB.update('businesses', v.id, { image: imageUrl, coverImage: coverUrl });
      await DB.loadAll();
      App.toast('✅ Imágenes guardadas');
      App.render();
    } catch(e){ App.toast('❌ ' + e.message); }
    finally { App.hideLoading(); }
    return;
  }

  if(t.id === 'changeZoneBtn'){ document.getElementById('locationBtn').click(); return; }
  if(t.id === 'checkoutBtn'){ WhatsApp.checkout(); return; }

  if(t.id === 'clearCart'){
    App.openModal(`
      <h3>🗑️ ¿Vaciar carrito?</h3>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close-modal>Cancelar</button>
        <button class="btn btn-danger" id="confirmClearCart">Sí</button>
      </div>
    `);
    document.getElementById('confirmClearCart').onclick = ()=>{
      Cart.clear(); App.closeModal(); App.render(); App.toast('🛒 Vaciado');
    };
    return;
  }

  if(t.id === 'applyCoupon'){
    const inp = document.getElementById('couponInput');
    const code = inp ? inp.value.trim() : '';
    if(!code) return App.toast('Ingresa un código');
    if(Cart.applyCoupon(code)) App.render();
    return;
  }
  if(t.id === 'rmCoupon'){ Cart.removeCoupon(); App.render(); App.toast('🎟️ Removido'); return; }

  if(t.id === 'logoutBtn'){ Auth.logout(); return; }

  if(t.id === 'regVendorBtn'){ window.location.href = 'index.html'; return; }
  if(t.id === 'reapplyVendor'){ window.location.href = 'index.html'; return; }

  if(t.id === 'toggleOpen'){ Vendors.toggleOpen(); return; }
  if(t.id === 'addProductBtn'){ Products.openForm(); return; }

  const editProd = t.closest('[data-edit-product]');
  if(editProd){ Products.openForm(editProd.dataset.editProduct); return; }

  const vcat = t.closest('[data-vcat]');
  if(vcat){
    const v = Vendors.current();
    if(!v) return;
    const id = vcat.dataset.vcat;
    let cats = [...v.categories];
    if(cats.includes(id)){
      if(cats.length === 1) return App.toast('Debes tener al menos una');
      cats = cats.filter(c=>c!==id);
    } else cats.push(id);
    await DB.update('businesses', v.id, { categories: cats });
    await DB.loadAll();
    App.render();
    return;
  }

  if(t.hasAttribute('data-confirm-switch')){
    const pid = t.dataset.pid;
    const q = +t.dataset.qty || 1;
    Cart.clear();
    App.closeModal();
    if(pid){
      const p = DB.get('products').find(x=>x.id===pid);
      if(p) Cart.add(p, q);
    }
    App.render();
    return;
  }
});

window.addEventListener('DOMContentLoaded', ()=>{
  App.init();
  Notifications.updateBadge();
});
</script>
