<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ff4d2e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Mercadito - Marketplace Local</title>

<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />

<style>
:root{
  --primary:#ff4d2e; --primary-dark:#e63a1c; --accent:#ffb800;
  --bg:#f5f6f8; --surface:#fff; --text:#1a1d22; --text-soft:#6b7280;
  --border:#eceef1; --success:#16a34a; --danger:#dc2626; --warn:#f59e0b;
  --radius:16px; --radius-sm:12px;
  --shadow-sm:0 2px 8px rgba(0,0,0,.06);
  --shadow-md:0 6px 20px rgba(0,0,0,.08);
  --shadow-lg:0 12px 32px rgba(0,0,0,.12);
  --nav-h:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
input,textarea,select{font-family:inherit;font-size:16px;}
.hidden{display:none !important;}
img{max-width:100%;display:block;}

.biz-img.real-img{background-size:cover;background-position:center;font-size:0;overflow:hidden;}
.biz-img.real-img .img-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.45));}
.biz-img.real-img .biz-badge,.biz-img.real-img .biz-offer{z-index:2;}
.biz-thumb.real-img{background-size:cover;background-position:center;font-size:0;}
.product-img.real-img{background-size:cover;background-position:center;font-size:0;}
.product-detail-hero.real-img{background-size:cover;background-position:center;font-size:0;}
.menu-header.real-cover{background-size:cover;background-position:center;position:relative;background-image:none;}
.menu-header.real-cover::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4),rgba(0,0,0,.75));border-radius:0 0 22px 22px;}
.menu-header.real-cover > *{position:relative;z-index:1;}

.img-upload{position:relative;border:2px dashed var(--border);border-radius:14px;padding:16px;text-align:center;background:#fafbfc;cursor:pointer;transition:all .2s;margin-bottom:12px;}
.img-upload:active{background:#fff1ec;border-color:var(--primary);}
.img-upload input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
.img-upload .preview{width:100%;height:120px;border-radius:10px;background-size:cover;background-position:center;margin-bottom:10px;display:none;}
.img-upload.has-img .preview{display:block;}
.img-upload.has-img .placeholder{display:none;}
.img-upload .placeholder{font-size:32px;opacity:.5;}
.img-upload small{display:block;color:var(--text-soft);font-size:11px;margin-top:6px;}
.img-upload.loading{opacity:.6;pointer-events:none;}

.progress-bar{height:6px;background:#eceef1;border-radius:3px;overflow:hidden;margin-top:8px;}
.progress-bar .fill{height:100%;background:var(--primary);transition:width .3s;}

.order-timeline{display:flex;justify-content:space-between;margin:14px 0;position:relative;padding:0 6px;}
.order-timeline::before{content:'';position:absolute;top:14px;left:8%;right:8%;height:2px;background:#e5e7eb;z-index:0;}
.order-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;z-index:1;}
.order-step .dot{width:28px;height:28px;border-radius:50%;background:#e5e7eb;color:#9ca3af;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .3s;}
.order-step.done .dot{background:var(--primary);color:#fff;}
.order-step.active .dot{background:var(--primary);color:#fff;box-shadow:0 0 0 4px rgba(255,77,46,.2);animation:pulse 1.6s infinite;}
.order-step small{font-size:10px;color:var(--text-soft);text-align:center;font-weight:600;}
.order-step.done small,.order-step.active small{color:var(--primary);}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(255,77,46,.2);}50%{box-shadow:0 0 0 8px rgba(255,77,46,.05);}}

.order-card-user{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
.order-card-user .order-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.order-card-user .order-biz{font-size:12px;color:var(--text-soft);margin-bottom:10px;}
.order-card-user .order-items{font-size:12px;color:var(--text-soft);margin:8px 0;padding:8px 10px;background:#fafbfc;border-radius:8px;line-height:1.5;}
.order-card-user .order-total{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);}

.vendor-order{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow-sm);border-left:4px solid var(--primary);}
.vendor-order.preparing{border-left-color:#f59e0b;}
.vendor-order.onway{border-left-color:#6366f1;}
.vendor-order.delivered{border-left-color:#16a34a;}
.vendor-order.cancelled{border-left-color:#dc2626;opacity:.7;}
.vendor-order .vo-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.vendor-order .vo-customer{font-size:12px;color:var(--text-soft);margin-bottom:8px;line-height:1.5;}
.vendor-order .vo-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.vendor-order .vo-actions .btn{flex:1;min-width:100px;padding:8px 10px;font-size:12px;}

.splash{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,var(--primary),#ff7a55);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .4s;}
.splash.hide{opacity:0;pointer-events:none;}
.splash-logo{font-size:68px;animation:pop .6s ease;}
.splash h1{margin:0;font-size:32px;letter-spacing:1px;}
.splash-loader{width:40px;height:40px;margin-top:12px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}

.app{min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;}
.app-header{position:sticky;top:0;z-index:50;background:var(--primary);color:#fff;padding:14px 16px 16px;border-radius:0 0 22px 22px;box-shadow:var(--shadow-md);}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.location{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px;border-radius:10px;transition:background .2s;}
.location:active{background:rgba(255,255,255,.15);}
.location small{opacity:.85;font-size:11px;display:block;}
.location strong{font-size:14px;}
.loc-icon{font-size:18px;}
.chev{opacity:.8;font-size:12px;}
.icon-btn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;transition:transform .15s;position:relative;}
.icon-btn:active{transform:scale(.92);}
.notif-badge{position:absolute;top:-2px;right:-2px;background:#dc2626;color:#fff;font-size:10px;padding:1px 5px;border-radius:20px;min-width:16px;text-align:center;font-weight:700;border:2px solid var(--primary);}
.search-bar{display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow-sm);}
.search-bar span{font-size:16px;}
.search-bar input{flex:1;border:none;outline:none;background:transparent;font-size:15px;color:var(--text);cursor:text;min-width:0;}
.search-bar .clear-btn{width:22px;height:22px;border-radius:50%;background:#e5e7eb;color:#6b7280;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

.app-main{flex:1;padding:16px 0 24px;}
.section{margin-bottom:26px;padding:0 16px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.section-head h2{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px;}
.section-head button{color:var(--primary);font-size:13px;font-weight:600;}

.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.cat-card{background:var(--surface);border-radius:var(--radius-sm);padding:14px 8px;text-align:center;box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .2s;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;}
.cat-card:active{transform:scale(.95);box-shadow:var(--shadow-md);}
.cat-card .emoji{font-size:26px;}
.cat-card small{font-size:11px;font-weight:600;color:var(--text-soft);line-height:1.2;}

.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;}
.hscroll::-webkit-scrollbar{display:none;}

.biz-card{flex:0 0 260px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden;transition:transform .15s,box-shadow .2s;cursor:pointer;}
.biz-card:active{transform:scale(.98);box-shadow:var(--shadow-md);}
.biz-card .biz-img{height:130px;background-size:cover;background-position:center;position:relative;display:flex;align-items:center;justify-content:center;font-size:46px;overflow:hidden;}
.biz-badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;backdrop-filter:blur(6px);z-index:2;}
.biz-badge.open{background:var(--success);}
.biz-badge.closed{background:var(--danger);}
.biz-offer{position:absolute;top:10px;right:10px;background:var(--accent);color:#000;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;z-index:2;}
.biz-body{padding:12px;}
.biz-name{font-weight:700;font-size:15px;margin:0 0 4px;}
.biz-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-soft);margin-bottom:8px;flex-wrap:wrap;}
.biz-meta .star{color:var(--accent);font-weight:700;}
.biz-tags{display:flex;flex-wrap:wrap;gap:6px;}
.tag{font-size:10px;padding:3px 8px;border-radius:20px;background:#f1f3f6;color:var(--text-soft);font-weight:600;}
.tag.primary{background:#fff1ec;color:var(--primary);}

.biz-row{display:flex;gap:12px;background:var(--surface);border-radius:var(--radius);padding:12px;margin-bottom:10px;box-shadow:var(--shadow-sm);transition:transform .15s;cursor:pointer;}
.biz-row:active{transform:scale(.99);}
.biz-thumb{width:72px;height:72px;border-radius:12px;background:linear-gradient(135deg,#ffe4d6,#ffd0bd);display:flex;align-items:center;justify-content:center;font-size:34px;flex-shrink:0;overflow:hidden;}
.biz-info{flex:1;min-width:0;}
.biz-info h3{margin:0 0 4px;font-size:15px;}
.biz-info p{margin:0 0 6px;font-size:12px;color:var(--text-soft);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;transition:transform .15s,box-shadow .2s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(255,77,46,.3);}
.btn-primary:disabled{opacity:.5;}
.btn-outline{background:transparent;border:1.5px solid var(--primary);color:var(--primary);}
.btn-ghost{background:#f1f3f6;color:var(--text);}
.btn-success{background:var(--success);color:#fff;}
.btn-danger{background:var(--danger);color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px;font-size:12px;}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:60;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);background:var(--surface);display:flex;border-top:1px solid var(--border);box-shadow:0 -4px 20px rgba(0,0,0,.05);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-soft);font-size:10px;font-weight:600;transition:color .2s;position:relative;}
.nav-item .nav-icon{font-size:20px;transition:transform .2s;}
.nav-item.active{color:var(--primary);}
.nav-item.active .nav-icon{transform:scale(1.1);}
.badge{position:absolute;top:6px;right:22%;background:var(--primary);color:#fff;font-size:10px;padding:1px 6px;border-radius:20px;min-width:18px;text-align:center;font-weight:700;}
.badge.bounce{animation:bounce .5s;}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}

.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.5);}
.modal-content{position:relative;z-index:1;background:#fff;width:100%;max-width:500px;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal h3{margin:0 0 8px;font-size:19px;}
.modal p{margin:0 0 16px;color:var(--text-soft);font-size:14px;line-height:1.5;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions .btn{flex:1;}

.product-detail-hero{width:100%;height:200px;border-radius:18px;background:linear-gradient(135deg,#fff3e8,#ffe0cc);display:flex;align-items:center;justify-content:center;font-size:110px;margin-bottom:16px;overflow:hidden;}
.product-detail h2{margin:0 0 8px;font-size:22px;}
.product-detail .desc{color:var(--text-soft);font-size:14px;line-height:1.5;margin:0 0 16px;}
.product-detail .price-big{font-size:26px;font-weight:800;color:var(--text);}
.product-detail .price-big .old{font-size:15px;color:var(--text-soft);text-decoration:line-through;margin-left:8px;font-weight:400;}
.product-detail .qty-row{display:flex;align-items:center;justify-content:space-between;margin:18px 0 6px;padding:12px 0;border-top:1px dashed var(--border);border-bottom:1px dashed var(--border);}
.product-detail .qty-row>span{font-weight:600;font-size:15px;color:var(--text);}
.product-detail .qty-ctrl{display:flex;align-items:center;gap:12px;background:var(--primary);color:#fff;border-radius:24px;padding:4px;}
.product-detail .qty-ctrl button{width:34px;height:34px;border-radius:50%;color:#fff;font-size:20px;font-weight:700;}
.product-detail .qty-ctrl span{font-size:16px;font-weight:700;min-width:24px;text-align:center;color:#fff;}

.toast{position:fixed;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%);background:#1a1d22;color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;font-weight:500;z-index:300;box-shadow:var(--shadow-lg);animation:toastIn .3s ease;max-width:90%;}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px);}to{opacity:1;transform:translate(-50%,0);}}

.menu-header{background:linear-gradient(160deg,var(--primary),#ff7a55);color:#fff;padding:20px 16px;border-radius:0 0 22px 22px;margin-bottom:16px;position:relative;overflow:hidden;}
.back-btn{background:rgba(255,255,255,.2);color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;}
.menu-header h1{margin:0 0 6px;font-size:22px;}
.menu-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;opacity:.95;margin-top:8px;}

.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:8px 16px;border-radius:20px;background:#fff;color:var(--text-soft);font-size:13px;font-weight:600;white-space:nowrap;border:1.5px solid var(--border);transition:all .2s;}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary);}

.product{display:flex;gap:12px;background:#fff;border-radius:var(--radius);padding:12px;margin-bottom:10px;box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .15s;}
.product:active{transform:scale(.99);}
.product-img{width:84px;height:84px;border-radius:12px;background:linear-gradient(135deg,#fff3e8,#ffe0cc);display:flex;align-items:center;justify-content:center;font-size:36px;flex-shrink:0;overflow:hidden;}
.product-info{flex:1;display:flex;flex-direction:column;min-width:0;}
.product-info h4{margin:0 0 4px;font-size:15px;}
.product-info p{margin:0 0 8px;font-size:12px;color:var(--text-soft);line-height:1.4;}
.product-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;}
.price{font-weight:700;font-size:15px;}
.price-old{font-size:12px;color:var(--text-soft);text-decoration:line-through;margin-left:6px;font-weight:400;}
.add-btn{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(255,77,46,.35);flex-shrink:0;position:relative;z-index:5;}
.qty-ctrl{display:flex;align-items:center;gap:8px;background:var(--primary);color:#fff;border-radius:20px;padding:2px;position:relative;z-index:5;}
.qty-ctrl button{width:30px;height:30px;border-radius:50%;color:#fff;font-size:16px;font-weight:700;}
.qty-ctrl span{font-size:14px;font-weight:700;min-width:18px;text-align:center;}

.cart-item{display:flex;gap:12px;align-items:center;background:#fff;padding:12px;border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow-sm);}
.cart-item-img{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,#fff3e8,#ffe0cc);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center;}
.cart-item-info{flex:1;min-width:0;}
.cart-item-info h4{margin:0 0 3px;font-size:14px;}
.cart-item-info small{color:var(--text-soft);font-size:12px;}
.summary{background:#fff;padding:16px;border-radius:var(--radius);box-shadow:var(--shadow-sm);margin:16px;}
.summary-row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;color:var(--text-soft);}
.summary-row.total{border-top:1px dashed var(--border);margin-top:8px;padding-top:12px;color:var(--text);font-weight:700;font-size:17px;}

.coupon-box{display:flex;gap:8px;margin-top:12px;}
.coupon-box input{flex:1;padding:10px 12px;border:1.5px dashed var(--border);border-radius:12px;background:#fafbfc;outline:none;text-transform:uppercase;font-size:14px;}
.coupon-box input:focus{border-color:var(--primary);background:#fff;}
.coupon-tag{display:inline-flex;align-items:center;gap:6px;background:#dcfce7;color:#166534;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;margin-top:10px;}
.coupon-tag button{color:#166534;font-weight:700;font-size:14px;padding:0 2px;}

.stars{display:flex;gap:4px;}
.star-btn{font-size:30px;color:#d1d5db;line-height:1;padding:0;transition:transform .1s,color .15s;}
.star-btn.active{color:var(--accent);}
.star-btn:active{transform:scale(.9);}
.review-card{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:var(--shadow-sm);}
.review-stars{color:var(--accent);letter-spacing:1px;font-size:14px;}

.search-results .group-title{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-soft);font-weight:700;margin:16px 16px 8px;}

.empty{text-align:center;padding:50px 24px;}
.empty .emoji{font-size:60px;margin-bottom:12px;display:block;}
.empty h3{margin:0 0 6px;}
.empty p{color:var(--text-soft);font-size:14px;margin:0 0 18px;}

.form-group{margin-bottom:14px;}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:#fafbfc;outline:none;transition:border-color .2s;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary);background:#fff;}
.form-group.error input,.form-group.error select,.form-group.error textarea{border-color:var(--danger);background:#fef2f2;}
.form-group .hint{font-size:11px;color:var(--text-soft);margin-top:4px;}
.form-group .err{font-size:11px;color:var(--danger);margin-top:4px;display:none;}
.form-group.error .err{display:block;}
.chip-select{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:8px 14px;border-radius:20px;background:#f1f3f6;color:var(--text-soft);font-size:13px;font-weight:600;transition:all .2s;}
.chip.active{background:var(--primary);color:#fff;}

.status{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700;}
.status.pending{background:#fef3c7;color:#92400e;}
.status.confirmed{background:#dbeafe;color:#1e40af;}
.status.preparing{background:#fed7aa;color:#9a3412;}
.status.onway{background:#e0e7ff;color:#3730a3;}
.status.delivered{background:#dcfce7;color:#166534;}
.status.cancelled{background:#fee2e2;color:#991b1b;}
.status.pending_approval{background:#fef3c7;color:#92400e;}
.status.approved{background:#dcfce7;color:#166534;}
.status.rejected{background:#fee2e2;color:#991b1b;}
.status.suspended{background:#e5e7eb;color:#374151;}

const safeUrl = u => {
  if (!u) return '';
  const s = String(u);
  if (!/^https?:\/\//i.test(s) && !/^data:image\//i.test(s)) return '';
  return s.replace(/["'()\\\s]/g, encodeURIComponent);
};

/* ============================================================
   IMAGE UTILS
   ============================================================ */
const ImageUtils = (() => {
  const MAX_SIZE_KB = 200;
  const MAX_DIMENSION = 1200;
  const HARD_LIMIT_MB = 10;

  async function compress(file, opts = {}){
    const maxKB = opts.maxKB || MAX_SIZE_KB;
    const maxDim = opts.maxDim || MAX_DIMENSION;
    if(!file.type.startsWith('image/')) throw new Error('El archivo no es una imagen');
    if(file.size > HARD_LIMIT_MB * 1024 * 1024) throw new Error(`La imagen supera los ${HARD_LIMIT_MB}MB`);

    const img = await loadImage(file);
    let { width, height } = img;
    if(width > maxDim || height > maxDim){
      const ratio = Math.min(maxDim / width, maxDim / height);
      width = Math.round(width * ratio);
      height = Math.round(height * ratio);
    }
    const canvas = document.createElement('canvas');
    canvas.width = width; canvas.height = height;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, width, height);
    ctx.drawImage(img, 0, 0, width, height);

    let quality = 0.85;
    let blob = await canvasToBlob(canvas, 'image/webp', quality);
    if(!blob || blob.size === 0) blob = await canvasToBlob(canvas, 'image/jpeg', quality);

    while(blob.size > maxKB * 1024 && quality > 0.3){
      quality -= 0.1;
      blob = await canvasToBlob(canvas, 'image/webp', quality);
      if(!blob || blob.size === 0) blob = await canvasToBlob(canvas, 'image/jpeg', quality);
    }
    let scale = 0.85;
    while(blob.size > maxKB * 1024 && scale > 0.3){
      const c2 = document.createElement('canvas');
      c2.width = Math.round(width * scale);
      c2.height = Math.round(height * scale);
      const cx = c2.getContext('2d');
      cx.imageSmoothingQuality = 'high';
      cx.fillStyle = '#ffffff';
      cx.fillRect(0, 0, c2.width, c2.height);
      cx.drawImage(canvas, 0, 0, c2.width, c2.height);
      blob = await canvasToBlob(c2, 'image/webp', quality);
      if(!blob || blob.size === 0) blob = await canvasToBlob(c2, 'image/jpeg', quality);
      scale -= 0.15;
    }
    const dataUrl = await blobToDataURL(blob);
    return { blob, dataUrl, size: blob.size, width, height };
  }

  function loadImage(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('No se pudo leer la imagen'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('Error leyendo el archivo'));
      reader.readAsDataURL(file);
    });
  }
  function canvasToBlob(canvas, type, quality){
    return new Promise(resolve => {
      try { canvas.toBlob(b => resolve(b), type, quality); }
      catch(e){ resolve(null); }
    });
  }
  function blobToDataURL(blob){
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });
  }

  async function uploadToStorage(blob, path){
    const fileRef = sRef(storage, path);
    await uploadBytes(fileRef, blob, { contentType: blob.type || 'image/webp' });
    return await getDownloadURL(fileRef);
  }

  let onMessage = null;
  function setMessageHandler(fn){ onMessage = fn; }
  function notify(msg){ if (typeof onMessage === 'function') onMessage(msg); }

  function bindUpload(input, previewEl, wrapper, opts = {}){
    input.addEventListener('change', async e => {
      const file = e.target.files[0];
      if(!file) return;
      wrapper.classList.add('loading');
      try{
        const result = await compress(file);
        previewEl.style.backgroundImage = `url(${result.dataUrl})`;
        wrapper.classList.add('has-img');
        wrapper.dataset.blobUrl = result.dataUrl;
        wrapper.dataset.pendingBlob = 'true';
        wrapper._blob = result.blob;
        notify(`✅ Comprimida: ${(file.size/1024).toFixed(0)}KB → ${(result.size/1024).toFixed(0)}KB`);
        if(opts.onDone) opts.onDone(result);
      }catch(err){
        notify('❌ ' + err.message);
      }finally{
        wrapper.classList.remove('loading');
      }
    });
  }

  function uploadBox(id, label, currentUrl = '', opts = {}){
    const safe = safeUrl(currentUrl);
    return `
      <div class="form-group">
        <label>${esc(label)}</label>
        <div class="img-upload ${currentUrl?'has-img':''}" id="${id}" ${currentUrl ? `data-existing="${esc(currentUrl)}"` : ''}>
          <input type="file" accept="image/*" />
          <div class="preview" style="${safe ? `background-image:url(${safe});` : ''}"></div>
          <div class="placeholder">📷</div>
          <div style="font-weight:600;font-size:13px;margin-top:4px">Toca para subir</div>
          <small>JPG, PNG o WebP · se comprime automáticamente</small>
        </div>
      </div>`;
  }

  function setup(id, opts = {}){
    const wrapper = document.getElementById(id);
    if(!wrapper) return;
    const input = wrapper.querySelector('input[type=file]');
    const preview = wrapper.querySelector('.preview');
    bindUpload(input, preview, wrapper, opts);
  }

  function getPendingBlob(id){
    const w = document.getElementById(id);
    return w ? w._blob : null;
  }
  function getExistingUrl(id){
    const w = document.getElementById(id);
    return w ? (w.dataset.existing || '') : '';
  }
  function hasNewImage(id){
    const w = document.getElementById(id);
    return w ? w.dataset.pendingBlob === 'true' : false;
  }

  return { compress, uploadToStorage, uploadBox, setup, getPendingBlob, getExistingUrl, hasNewImage, setMessageHandler };
})();

/* ============================================================
   DB
   ============================================================ */
const DB = (() => {
  const collections = ['businesses','products','orders','reviews','promos','coupons','categories','users'];
  const cache = {};
  collections.forEach(c => cache[c] = []);

  async function loadAll(){
    await Promise.all(collections.map(async c => {
      try {
        const snap = await getDocs(collection(db, c));
        cache[c] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } catch(e){
        console.warn('DB load error for', c, e);
        cache[c] = [];
      }
    }));
  }

  function seedIfEmpty(){ return Promise.resolve(); }

  function get(c){ return cache[c] || []; }

  async function add(c, data, id){
    const ref = id ? doc(db, c, id) : doc(collection(db, c));
    const payload = { ...data, createdAt: serverTimestamp(), updatedAt: serverTimestamp() };
    await setDoc(ref, payload);
    return ref.id;
  }
  async function update(c, id, data){
    await updateDoc(doc(db, c, id), { ...data, updatedAt: serverTimestamp() });
  }
  async function remove(c, id){
    await deleteDoc(doc(db, c, id));
  }

  return { loadAll, seedIfEmpty, get, add, update, remove, cache };
})();

/* ============================================================
   AUTH
   ============================================================ */
const Auth = (() => {
  const KEY_USER = 'mercadito_profile';
  let currentProfile = null;
  let redirected = false;

  function profile(){ return currentProfile; }
  function isAdmin(){ return currentProfile?.role === 'admin'; }
  function isVendor(){ return currentProfile?.role === 'vendor'; }

  function saveLocal(p){ localStorage.setItem(KEY_USER, JSON.stringify(p)); currentProfile = p; }

  async function init(){
    return new Promise(resolve => {
      onAuthStateChanged(auth, async user => {
        if(!user){
          if(!redirected){
            redirected = true;
            window.location.href = 'index.html';
          }
          resolve(null);
          return;
        }

        try {
          const snap = await getDoc(doc(db, 'users', user.uid));
          if(snap.exists()){
            const data = snap.data();
            currentProfile = {
              uid: user.uid,
              name: data.name || user.displayName || 'Usuario',
              email: data.email || user.email || '',
              phone: data.phone || '',
              role: data.role || 'customer'
            };
            saveLocal(currentProfile);

            // ✅ FALLBACK: solo si NO se creó el negocio desde index.html
            if(currentProfile.role === 'vendor' && data.business && !data.businessCreated){
              await autoCreateBusiness(user.uid, data.business, currentProfile);
            }
          } else {
            const payload = {
              name: user.displayName || 'Usuario',
              email: user.email || '',
              phone: '',
              role: 'customer',
              createdAt: serverTimestamp()
            };
            await setDoc(doc(db, 'users', user.uid), payload);
            currentProfile = { uid: user.uid, ...payload };
            saveLocal(currentProfile);
          }
        } catch(e){
          console.error('Auth init error:', e);
        }

        resolve(currentProfile);
      });
    });
  }

  // ✅ Fallback: solo se ejecuta si el negocio NO se creó desde index.html
  //    (registros viejos). Ahora usa los datos reales del wizard.
  async function autoCreateBusiness(uid, biz, profile){
    try {
      const snap = await getDocs(query(collection(db, 'businesses'), where('ownerId','==', uid)));
      if(!snap.empty){
        await setDoc(doc(db, 'users', uid), { businessCreated: true }, { merge: true });
        return;
      }

      const catMap = {
        hamburguesas:{id:'hamburguesas', emoji:'🍔', name:'Hamburguesas'},
        tacos:{id:'tacos', emoji:'🌮', name:'Tacos'},
        pizzas:{id:'pizzas', emoji:'🍕', name:'Pizzas'},
        pollo:{id:'pollo', emoji:'🍗', name:'Pollo'},
        sushi:{id:'sushi', emoji:'🍣', name:'Sushi'},
        bebidas:{id:'bebidas', emoji:'🥤', name:'Bebidas'},
        postres:{id:'postres', emoji:'🍰', name:'Postres'},
        cafeterias:{id:'cafeterias', emoji:'☕', name:'Cafeterías'},
        carnes:{id:'carnes', emoji:'🥩', name:'Carnes'},
        mexicana:{id:'mexicana', emoji:'🌯', name:'Comida mexicana'},
        rapida:{id:'rapida', emoji:'🍟', name:'Comida rápida'},
        abarrotes:{id:'abarrotes', emoji:'🛒', name:'Abarrotes'},
        farmacias:{id:'farmacias', emoji:'💊', name:'Farmacias'},
        otros:{id:'otros', emoji:'🌸', name:'Otros'}
      };
      const cat = catMap[biz.category] || catMap.otros;

      try {
        await setDoc(doc(db, 'categories', cat.id), { name: cat.name, emoji: cat.emoji }, { merge: true });
      } catch(e){}

      const bizData = {
        ownerId: uid,
        ownerName: profile.name,
        name: biz.name,
        whatsapp: biz.whatsapp,
        address: biz.address,
        colony: biz.colony || 'Fraccionamiento Río Medio 3',
        description: 'Negocio pendiente de completar información.',
        schedule: '10:00 - 22:00',
        deliveryFrom: biz.deliveryFrom || 25,
        categories: [cat.id],
        city: 'Veracruz',
        image: '',
        coverImage: '',
        logo: cat.emoji,
        cover: cat.emoji,
        rating: 0,
        reviews: 0,
        timeMin: 20,
        timeMax: 40,
        open: false,
        featured: false,
        popular: false,
        new: true,
        offer: false,
        delivery: {
          home: true,
          pickup: true,
          freeFrom: biz.freeFrom || 0
        },
        status: 'pending',
        rejectionReason: null,
        approvedAt: null,
        approvedBy: null,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      };

      await addDoc(collection(db, 'businesses'), bizData);
      await setDoc(doc(db, 'users', uid), { businessCreated: true }, { merge: true });
      console.log('✅ Negocio creado (fallback):', biz.name);
    } catch(e){
      console.error('autoCreateBusiness error:', e);
    }
  }

  async function logout(){
    // ✅ Limpiar carrito del usuario que se va (antes de borrar el perfil)
    const uid = currentProfile?.uid;
    if(uid){
      try { localStorage.removeItem(`mercadito_cart_v3_${uid}`); } catch(e){}
    }
    try { await signOut(auth); } catch(e){}
    localStorage.removeItem(KEY_USER);
    currentProfile = null;
    window.location.href = 'index.html';
  }

  function openLogin(cb){
    window.location.href = 'index.html';
  }

  const FAV = 'mercadito_favs_v2';
  function favorites(){
    try { return JSON.parse(localStorage.getItem(FAV) || '{"businesses":[],"products":[]}'); }
    catch { return { businesses:[], products:[] }; }
  }
  function toggleFav(type, id){
    const f = favorites();
    const l = f[type];
    const i = l.indexOf(id);
    if(i >= 0) l.splice(i,1); else l.push(id);
    localStorage.setItem(FAV, JSON.stringify(f));
    App.toast(i >= 0 ? '💔 Eliminado' : '❤️ Agregado a favoritos');
  }

  return { init, logout, openLogin, profile, isAdmin, isVendor, favorites, toggleFav };
})();

/* ============================================================
   NOTIFICACIONES
   ============================================================ */
const Notifications = (() => {
  const KEY = 'mercadito_notifications';
  function list(){ try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; } }
  function save(l){ localStorage.setItem(KEY, JSON.stringify(l)); updateBadge(); }
  function add({title, body, icon='🔔'}){
    const l = list();
    l.unshift({ id:'n_'+Date.now()+Math.random(), title, body, icon, date:new Date().toISOString(), read:false });
    save(l.slice(0,60));
    App.toast(`${icon} ${title}`);
    if('Notification' in window && Notification.permission === 'granted'){
      try{ new Notification(title, { body }); }catch(e){}
    }
  }
  function unreadCount(){ return list().filter(n=>!n.read).length; }
  function markAllRead(){ save(list().map(n=>({...n, read:true}))); }
  function clear(){ save([]); }
  function updateBadge(){
    const b = document.getElementById('notifBadge');
    if(!b) return;
    const n = unreadCount();
    b.textContent = n > 99 ? '99+' : n;
    b.classList.toggle('hidden', n === 0);
  }
  async function requestPermission(){
    if(!('Notification' in window)){ App.toast('⚠️ Navegador sin soporte'); return false; }
    if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
      App.toast('⚠️ Requiere HTTPS');
      return false;
    }
    if(Notification.permission === 'granted') return true;
    if(Notification.permission === 'denied'){ App.toast('🔕 Bloqueadas'); return false; }
    const p = await Notification.requestPermission();

/* ============================================================
   CARRITO
   ============================================================ */
const Cart = (() => {
  const BASE_KEY = 'mercadito_cart_v3';
  // ✅ Clave única por usuario (UID). Si no hay sesión, usa "guest"
  function key(){
    const uid = Auth.profile()?.uid || 'guest';
    return `${BASE_KEY}_${uid}`;
  }
  function load(){
    try {
      const c = JSON.parse(localStorage.getItem(key()) || '{"businessId":null,"items":[],"coupon":null}');
      if(!('coupon' in c)) c.coupon = null;
      return c;
    } catch { return { businessId:null, items:[], coupon:null }; }
  }
  function save(c){ localStorage.setItem(key(), JSON.stringify(c)); updateBadge(); }
  function items(){ return load().items; }
  function businessId(){ return load().businessId; }
  function qty(id){ const it = items().find(x=>x.id===id); return it ? it.qty : 0; }
  function coupon(){ return load().coupon; }

  function add(product, addQty=1){
    const biz = DB.get('businesses').find(x => x.id === product.businessId);
    if(!biz) return App.toast('❌ Negocio no encontrado');
    if(biz.status !== 'approved') return App.toast('⏸️ Negocio no disponible');
    if(!biz.open) return App.toast('🔴 Cerrado');
    // ✅ Sin restricción de zona: puedes comprar a cualquier negocio

    const maxStock = Number.isFinite(product.stock) ? product.stock : Infinity;
    const currentQty = qty(product.id);
    if (currentQty + addQty > maxStock) {
      return App.toast(`⚠️ Solo quedan ${maxStock} disponibles`);
    }

    const c = load();
    if(c.businessId && c.businessId !== product.businessId){
      App.openModal(`
        <h3>🛒 Carrito con otro negocio</h3>
        <p>¿Vaciar y comenzar un pedido nuevo?</p>
        <div class="modal-actions">
          <button class="btn btn-ghost" data-close-modal>Cancelar</button>
          <button class="btn btn-primary" data-confirm-switch data-pid="${esc(product.id)}" data-qty="${addQty}">Continuar</button>
        </div>
      `);
      return;
    }
    if(!c.businessId) c.businessId = product.businessId;
    const existing = c.items.find(x=>x.id===product.id);
    if(existing) existing.qty += addQty;
    else c.items.push({ id:product.id, name:product.name, price:product.price, emoji:product.emoji, image:product.image || '', qty:addQty, stock: product.stock ?? null });
    save(c);
    App.toast(`✅ ${product.name} agregado`);
  }
  function inc(id){
    const prod = DB.get('products').find(p => p.id === id);
    const c = load();
    const it = c.items.find(x=>x.id===id);
    if(!it) return;
    const maxStock = prod && Number.isFinite(prod.stock) ? prod.stock : (it.stock ?? Infinity);
    if (it.qty + 1 > maxStock) return App.toast(`⚠️ Solo quedan ${maxStock}`);
    it.qty++; save(c);
  }
  function dec(id){
    const c=load(); const it=c.items.find(x=>x.id===id); if(!it) return;
    it.qty--; if(it.qty<=0) c.items = c.items.filter(x=>x.id!==id);
    if(!c.items.length){ c.businessId=null; c.coupon=null; }
    save(c);
  }
  function clear(){ save({ businessId:null, items:[], coupon:null }); }
  function subtotal(){ return items().reduce((s,i)=>s + i.price * i.qty, 0); }
  function deliveryCost(){
    const bId = businessId(); if(!bId) return 0;
    const b = DB.get('businesses').find(x=>x.id===bId); if(!b) return 0;
    if(b.delivery?.freeFrom && subtotal() >= b.delivery.freeFrom) return 0;
    return b.deliveryFrom || 0;
  }
  function discount(){
    const c = load();
    if(!c.coupon || !c.businessId) return 0;
    const r = Coupons.validate(c.coupon.code, subtotal(), c.businessId);
    return r.ok ? r.discount : 0;
  }
  function total(){ return Math.max(0, subtotal() + deliveryCost() - discount()); }
  function applyCoupon(code){
    const c = load();
    if(!c.businessId || !c.items.length) return App.toast('Agrega productos primero');
    const r = Coupons.validate(code, subtotal(), c.businessId);
    if(!r.ok) return App.toast('❌ ' + r.msg);
    c.coupon = { code:r.coupon.code, discount:r.discount };
    save(c);
    App.toast('🎟️ Cupón aplicado: -' + money(r.discount));
    return true;
  }
  function removeCoupon(){ const c=load(); c.coupon=null; save(c); }
  function updateBadge(){
    const n = items().reduce((s,i)=>s + i.qty, 0);
    const badge = document.getElementById('cartBadge');
    if(!badge) return;
    const prev = +badge.textContent || 0;
    badge.textContent = n;
    badge.classList.toggle('hidden', n === 0);
    if(n > prev){ badge.classList.remove('bounce'); void badge.offsetWidth; badge.classList.add('bounce'); }
  }
  function floatingBar(){
    return `
      <div class="floating-bar">
        <button class="btn btn-primary btn-block" data-nav="cart">
          🛒 Ver carrito (${items().reduce((s,i)=>s+i.qty,0)}) · ${money(total())}
        </button>
      </div>`;
  }
  return { items, businessId, qty, coupon, add, inc, dec, clear, subtotal, deliveryCost, discount, total, updateBadge, floatingBar, applyCoupon, removeCoupon };
})();

const Coupons = (() => {
  function all(){ return DB.get('coupons'); }
  function validate(code, subtotal, businessId){
    const c = all().find(x => x.code.toUpperCase() === String(code).toUpperCase().trim());
    if(!c) return { ok:false, msg:'Cupón no encontrado' };
    if(!c.active) return { ok:false, msg:'Cupón inactivo' };
    if(c.expiresAt && c.expiresAt < new Date().toISOString().slice(0,10)) return { ok:false, msg:'Expirado' };
    if(c.minPurchase && subtotal < c.minPurchase) return { ok:false, msg:`Mínimo ${money(c.minPurchase)}` };
    if(c.businessId && c.businessId !== businessId) return { ok:false, msg:'No válido aquí' };
    if(c.maxUses && (c.uses || 0) >= c.maxUses) return { ok:false, msg:'Agotado' };
    const raw = c.type === 'percent' ? Math.round(subtotal * c.value / 100) : c.value;
    return { ok:true, coupon:c, discount: Math.min(raw, subtotal) };
  }
  async function incrementUses(code){
    const c = all().find(x => x.code.toUpperCase() === String(code).toUpperCase());
    if(c) await DB.update('coupons', c.id, { uses: (c.uses || 0) + 1 });
  }

                ${c.type === 'percent' ? `${c.value}% desc.` : `${money(c.value)} desc.`}
                ${c.minPurchase ? ` · mín ${money(c.minPurchase)}` : ''}
              </div>
              <div style="font-size:11px;color:var(--text-soft);margin-top:2px">
                ${c.active ? '🟢 Activo' : '🔴 Inactivo'} · usos: ${c.uses || 0}${c.maxUses ? '/' + c.maxUses : ''}
              </div>
            </div>
            <button class="btn btn-ghost btn-sm" data-edit-coupon="${esc(c.id)}">Editar</button>
          </div>`).join('') : `<div class="empty" style="padding:30px"><span class="emoji">🎟️</span><p>Sin cupones</p></div>`}

      <div class="modal-actions">
        <button class="btn btn-ghost" data-close-modal>Cerrar</button>
        <button class="btn btn-primary" id="newCouponBtn">+ Nuevo</button>

  function openForm(id){

      <div class="form-group"><label>Tipo</label>
        <select id="cpType">
          <option value="percent" ${c?.type==='percent'?'selected':''}>Porcentaje (%)</option>

        </select>

      <div class="form-group"><label>Compra mínima</label><input id="cpMin" type="number" value="${c?.minPurchase || 0}" /></div>
      <div class="form-group"><label>Negocio (opcional)</label>
        <select id="cpBiz">
          <option value="">🌐 Todos</option>

      <div class="form-group"><label>Máx. usos (0=ilimitado)</label><input id="cpMax" type="number" value="${c?.maxUses || 0}" /></div>

          await DB.add('coupons', { ...data, uses:0 });
        }
        await DB.loadAll();
        App.closeModal();
        App.toast(c ? '✅ Actualizado' : '🎟️ Creado');
        App.render();
      } catch(e){ App.toast('❌ ' + e.message); }
    };
    const del = document.getElementById('delCoupon');
    if(del) del.onclick = async ()=>{
      await DB.remove('coupons', c.id);
      await DB.loadAll();
      App.closeModal();

    };
  }
  return { all, validate, incrementUses, openAdminList, openForm };
})();

/* ============================================================
   VALIDACIÓN DE NEGOCIOS
   ============================================================ */
const BizValidation = (() => {
  function validate(data){
    const errors = {};
    if(!data.owner || data.owner.trim().length < 3) errors.owner = 'Mínimo 3 caracteres';
    if(!data.name || data.name.trim().length < 3) errors.name = 'Mínimo 3 caracteres';
    if(!data.whatsapp || !/^\d{10,15}$/.test(String(data.whatsapp).replace(/\D/g,''))) errors.whatsapp = 'Debe tener 10-15 dígitos';
    if(!data.address || data.address.trim().length < 5) errors.address = 'Dirección muy corta';
    if(!data.colony || data.colony.trim() === '') errors.colony = 'Debes elegir una zona';
    else if(!ZONE_NAMES.includes(data.colony)) errors.colony = 'Zona no válida';
    if(!data.description || data.description.trim().length < 15) errors.description = 'Mínimo 15 caracteres';
    if(!data.categories || !data.categories.length) errors.categories = 'Selecciona al menos una';
    if(!data.schedule || !/^\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}$/.test(data.schedule)) errors.schedule = 'Formato HH:MM - HH:MM';
    const del = Number(data.deliveryFrom);
    if(isNaN(del) || del < 0 || del > 500) errors.deliveryFrom = 'Entre $0 y $500';
    return { valid: Object.keys(errors).length === 0, errors };
  }
  function renderErrors(errors, prefix){
    Object.keys(errors).forEach(k=>{
      const fg = document.getElementById(prefix + k);
      if(fg){
        fg.classList.add('error');
        const errEl = fg.querySelector('.err');
        if(errEl) errEl.textContent = errors[k];
      }
    });
  }
  function clearErrors(prefix){
    document.querySelectorAll(`[id^="${prefix}"]`).forEach(fg=>{
      fg.classList.remove('error');
      const e = fg.querySelector('.err');
      if(e) e.textContent = '';
    });
  }
  return { validate, renderErrors, clearErrors };
})();

/* ============================================================
   VENDORS
   ============================================================ */
const Vendors = (() => {
  function current(){
    const p = Auth.profile();
    if(!p) return null;
    return DB.get('businesses').find(b => b.ownerId === p.uid) || null;
  }

  async function toggleOpen(){
    const v = current();
    if(!v) return;
    if(v.status !== 'approved') return App.toast('⏸️ Negocio no aprobado');
    await DB.update('businesses', v.id, { open: !v.open });
    await DB.loadAll();
    App.toast(!v.open ? '🟢 Abierto' : '🔴 Cerrado');
    App.render();
  }

  function openRegister(){
    window.location.href = 'index.html';
  }

  async function changeZone(newZone){
    if(!Auth.isAdmin()) {
      return App.toast('🔒 La zona no se puede cambiar. Contacta al administrador.');
    }
    if(!ZONE_NAMES.includes(newZone)) 
      return App.toast('Zona no válida');
    
    const v = current();
    if(!v) return;
    
    await DB.update('businesses', v.id, { colony: newZone });
    await DB.loadAll();
    App.toast('📍 Zona actualizada por admin');
    App.render();
  }

  async function saveDeliveryCosts(){
    const v = current();
    if(!v) return;
    
    const newDeliveryFrom = +document.getElementById('editDeliveryFrom').value || 0;
    const newFreeFrom = +document.getElementById('editFreeFrom').value || 0;
    
    if(newDeliveryFrom < 0 || newDeliveryFrom > 500) 
      return App.toast('❌ Costo entre $0 y $500');
    if(newFreeFrom < 0) 
      return App.toast('❌ Valor inválido');
    
    App.showLoading();
    try {
      await DB.update('businesses', v.id, {
        deliveryFrom: newDeliveryFrom,
        delivery: {
          ...(v.delivery || {}),
          freeFrom: newFreeFrom
        }
      });
      await DB.loadAll();
      App.toast('✅ Costos actualizados');
      App.render();
    } catch(e) {
      App.toast('❌ ' + e.message);
    } finally {
      App.hideLoading();
    }
  }

  return { current, toggleOpen, openRegister, changeZone, saveDeliveryCosts };
})();

      <div class="form-group"><label>Comentario *</label><textarea id="rvText" rows="3" placeholder="Cuéntanos tu experiencia..."></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close-modal>Cancelar</button>
        <button class="btn btn-primary" id="submitReview">Publicar</button>
      </div>
    `);
    const picker = document.getElementById('starPicker');
    function paint(){
      picker.querySelectorAll('[data-star]').forEach(btn=>{
        const n = +btn.dataset.star;
        btn.textContent = n <= rating ? '★' : '☆';
        btn.classList.toggle('active', n <= rating);
      });
    }
    picker.querySelectorAll('[data-star]').forEach(btn=>{ btn.onclick = ()=>{ rating = +btn.dataset.star; paint(); }; });
    document.getElementById('submitReview').onclick = async ()=>{
      const text = document.getElementById('rvText').value.trim();
      if(text.length < 5) return App.toast('Escribe al menos 5 caracteres');
      try {
        await DB.add('reviews', { businessId:bizId, user:u.name, userId:u.uid, rating, text, date:new Date().toISOString().slice(0,10) });
        await updateBizRating(bizId);
        await DB.loadAll();
        App.closeModal();
        App.toast('🎉 ¡Gracias!');
        Notifications.add({ title:'Reseña publicada', body:`Gracias por calificar`, icon:'⭐' });
        App.render();
      } catch(e){ App.toast('❌ ' + e.message); }
    };
  }
  function renderCard(r){
    const stars = '★'.repeat(r.rating) + '☆'.repeat(5 - r.rating);
    return `
      <div class="review-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <strong style="font-size:14px">${esc(r.user)}</strong>
          <span class="review-stars">${stars}</span>
        </div>
        <p style="margin:0;font-size:13px;color:var(--text-soft);line-height:1.4">${esc(r.text)}</p>
        <small style="color:#9ca3af;font-size:11px">${esc(r.date)}</small>
      </div>`;
  }
  return { forBusiness, updateBizRating, openForm, renderCard };
})();

/* ============================================================
   ORDERS
   ============================================================ */
const Orders = (() => {
  const FLOW = ['pending', 'preparing', 'onway', 'delivered'];

  function list(){ return DB.get('orders'); }
  function listForUser(){
    const u = Auth.profile();
    if(!u) return [];
    return list().filter(o => o.userId === u.uid);
  }
  function forBusiness(bizId){ return list().filter(o => o.businessId === bizId); }
  function getByNumber(number){ return list().find(o => o.number === number); }
  function statusLabel(s){
    return {
      pending:'🟡 Recibido', confirmed:'🔵 Confirmado',
      preparing:'🟠 Preparando', onway:'🚚 En camino',
      delivered:'🟢 Entregado', cancelled:'❌ Cancelado'
    }[s] || s;
  }
  function nextNumber(){ return 1000 + list().length + Math.floor(Math.random() * 900); }

  async function create(order){ await DB.add('orders', order); }
  async function updateStatus(id, status){
    const o = list().find(x => x.id === id);
    if(!o) return null;
    await DB.update('orders', id, { status });
    return { ...o, status };
  }

  return { list, listForUser, forBusiness, getByNumber, statusLabel, nextNumber, create, updateStatus, FLOW };
})();

/* ============================================================
   WHATSAPP CHECKOUT
   ============================================================ */
const WhatsApp = (() => {
  function checkout(){
    const items = Cart.items();
    if(!items.length) return App.toast('El carrito está vacío');
    const b = DB.get('businesses').find(x=>x.id===Cart.businessId());
    if(!b) return App.toast('Negocio no encontrado');
    if(b.status !== 'approved') return App.toast('⏸️ Negocio no disponible');
    if(!b.open) return App.toast('🔴 El negocio está cerrado');

    const u = Auth.profile();
    if(!u) return Auth.openLogin(()=> checkout());

    const sub = Cart.subtotal();
    const del = Cart.deliveryCost();
    const disc = Cart.discount();
    const tot = Cart.total();
    const coup = Cart.coupon();

    App.openModal(`
      <h3>📋 Confirmar pedido</h3>
      <p>Pedido a <strong>${esc(b.name)}</strong> · 📍 ${esc(b.colony)}</p>
      <div class="form-group"><label>📍 Dirección *</label><input id="oAddr" placeholder="Calle, número" /><div class="err" style="color:#dc2626;font-size:11px"></div></div>
      <div class="form-group"><label>🏠 Fraccionamiento de entrega *</label>
        <select id="oColony">
          ${ZONE_NAMES.map(z => `<option value="${esc(z)}" ${z === App.state.location.colony ? 'selected' : ''}>${esc(z)}</option>`).join('')}
        </select>
      </div>
      <div class="form-group"><label>📝 Referencia</label><input id="oRef" placeholder="Casa azul, portón negro..." /></div>
      <div class="form-group"><label>💳 Pago</label>
        <select id="oPay"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select>
      </div>
      <div class="summary" style="margin:0 0 12px">
        <div class="summary-row"><span>Subtotal</span><span>${money(sub)}</span></div>
        <div class="summary-row"><span>Envío</span><span>${del ? money(del) : 'Gratis'}</span></div>
        ${disc ? `<div class="summary-row" style="color:#16a34a"><span>🎟️ ${esc(coup.code)}</span><span>-${money(disc)}</span></div>` : ''}
        <div class="summary-row total"><span>Total</span><span>${money(tot)}</span></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" data-close-modal>Cancelar</button>
        <button class="btn btn-primary" id="sendWa">📲 Enviar por WhatsApp</button>
      </div>
    `);
    document.getElementById('sendWa').onclick = ()=>{
      const addr = document.getElementById('oAddr').value.trim();
      const colony = document.getElementById('oColony').value.trim();
      const ref = document.getElementById('oRef').value.trim();
      const pay = document.getElementById('oPay').value;
      if(addr.length < 5) return App.toast('❌ Dirección muy corta');

      const num = Orders.nextNumber();
      const lines = items.map(i=>`${i.qty}x ${i.name} — ${money(i.price * i.qty)}`).join('\n');
      const couponLine = disc ? `\n🎟️ Cupón ${coup.code}: -${money(disc)}` : '';
      const msg = `Hola, ${b.name}. 👋\n\nQuiero el siguiente pedido:\n\n🛒 Pedido #${num}\n\n${lines}\n\nSubtotal: ${money(sub)}\nEnvío: ${del ? money(del) : 'Gratis'}${couponLine}\n\nTOTAL: ${money(tot)}\n\n📍 ${addr}\n🏠 ${colony}\n📝 ${ref || 'Sin referencia'}\n💳 ${pay}\n👤 ${u.name}\n\nGracias.`;

      const url = `https://wa.me/${b.whatsapp}?text=${encodeURIComponent(msg)}`;
      const win = window.open(url, '_blank');

      App.showLoading();
      (async () => {
        try {
          await Orders.create({
            number: num,
            businessId: b.id,
            businessName: b.name,
            colony: b.colony,
            items: items.map(i => ({...i})),
            subtotal: sub, delivery: del, discount: disc, total: tot,
            coupon: coup ? coup.code : null,
            status: 'pending',
            userId: u.uid,
            customer: { name: u.name, phone: u.phone, address: addr, colony, reference: ref, pay },
            date: new Date().toLocaleDateString('es-MX')
          });
          if(coup) await Coupons.incrementUses(coup.code);
          await DB.loadAll();
          Notifications.add({ title:'Pedido enviado 🎉', body:`#${num} · ${money(tot)}`, icon:'📦' });
          Cart.clear();
          App.closeModal();
          App.toast('✅ Pedido enviado');
          setTimeout(()=>App.navigate('orders'), 400);
        } catch(e){
          App.toast('❌ ' + e.message);
        } finally {
          App.hideLoading();
          if(!win) App.toast('⚠️ Permite ventanas emergentes');
        }
      })();
    };
  }
  return { checkout };
})();

const Promos = (() => {
  function activeForZone(){
    const today = new Date().toISOString().slice(0,10);

      .filter(p => p.active && p.paid && (!p.startDate || p.startDate <= today) && (!p.endDate || p.endDate >= today))
      .sort((a,b) => (a.priority||99) - (b.priority||99));

  function all(){ return DB.get('promos'); }
  function openForm(id){
    const promo = id ? all().find(p => p.id === id) : null;
    const businesses = DB.get('businesses').filter(b => b.status === 'approved');

    App.openModal(`

      <div class="form-group"><label>Negocio</label>
        <select id="prBiz">${businesses.map(b => `<option value="${esc(b.id)}" ${promo?.businessId===b.id?'selected':''}>${esc(b.logo||'🏪')} ${esc(b.name)}</option>`).join('')}</select>
      </div>
      <div class="form-group"><label>Título *</label><input id="prTitle" value="${esc(promo?.title || '')}" /></div>

      <div class="form-group"><label>Estado del pago</label><button type="button" class="chip ${promo?.paid?'active':''}" id="prPaid">💰 Pagado</button></div>
      <div class="form-group"><label>Visible</label><button type="button" class="chip ${promo?.active?'active':''}" id="prActive">👁️ Activo</button></div>
      <div class="modal-actions">
        ${promo ? `<button class="btn btn-ghost" id="delPromo" style="color:#dc2626">Eliminar</button>` : ''}
        <button class="btn btn-primary" id="savePromo">${promo ? 'Guardar' : 'Crear'}</button>
      </div>
    `);
    let paid = promo?.paid || false;
    let active = promo?.active ?? true;
    document.getElementById('prPaid').onclick = e => { paid = !paid; e.target.classList.toggle('active', paid); };
    document.getElementById('prActive').onclick = e => { active = !active; e.target.classList.toggle('active', active); };
    document.getElementById('savePromo').onclick = async ()=>{
      const data = {
        businessId: document.getElementById('prBiz').value,
        title: document.getElementById('prTitle').value.trim(),
        subtitle: document.getElementById('prSubtitle').value.trim(),
        emoji: document.getElementById('prEmoji').value.trim() || '🔥',
        bg: document.getElementById('prBg').value.trim() || 'linear-gradient(135deg,#ff4d2e,#ff7a55)',
        price: +document.getElementById('prPrice').value || 0,
        startDate: document.getElementById('prStart').value,
        endDate: document.getElementById('prEnd').value,
        paid, active,
        priority: promo?.priority ?? (all().length + 1)
      };
      if(!data.title) return App.toast('Título obligatorio');
      try {
        if(promo) await DB.update('promos', promo.id, data);
        else { await DB.add('promos', data); Notifications.add({ title:'Nueva promo', body:data.title, icon:'🎠' }); }
        await DB.loadAll();
        App.closeModal();
        App.toast(promo ? '✅ Actualizado' : '🎉 Creado');
        App.render();
      } catch(e){ App.toast('❌ ' + e.message); }
    };
    const del = document.getElementById('delPromo');
    if(del) del.onclick = async ()=>{
      await DB.remove('promos', promo.id);
      await DB.loadAll();
      App.closeModal();
      App.toast('🗑️ Eliminado');
      App.render();
    };
  }
  function openList(){
    const l = all();
    const businesses = DB.get('businesses');
    App.openModal(`
      <h3>🎠 Carrusel</h3>
      <p>${l.length} promociones</p>
      <div style="max-height:60vh;overflow-y:auto;margin-bottom:12px">
        ${l.length ? l.map(p => {
          const b = businesses.find(x => x.id === p.businessId);
          return `

              </div>
              <button class="btn btn-ghost btn-sm" data-edit-promo="${esc(p.id)}">Editar</button>
            </div>`;
        }).join('') : `<div class="empty" style="padding:30px"><span class="emoji">🎠</span><p>Sin promos</p></div>`}

        <button class="btn btn-ghost" data-close-modal>Cerrar</button>
        <button class="btn btn-primary" id="newPromoBtn">+ Nueva</button>

    `);

    if(n) n.onclick = ()=> openForm();
  }
  return { activeForZone, all, openForm, openList };
})();

        {id:'pizzas',name:'Pizzas',emoji:'🍕'},

        {id:'postres',name:'Postres',emoji:'🍰'},
        {id:'cafeterias',name:'Cafeterías',emoji:'☕'},
        {id:'abarrotes',name:'Abarrotes',emoji:'🛒'},
        {id:'farmacias',name:'Farmacias',emoji:'💊'}
      ];
      for(const c of cats){
        try { await DB.add('categories', { name: c.name, emoji: c.emoji }, c.id); } catch(e){}

  };

    const steps = [

      { key:'onway', icon:'🚚', label:'En camino' },

/* ============================================================
   CATEGORÍAS
   ============================================================ */
const Categories = (() => {
  function sort(list, by){
    const l = [...list];
    switch(by){
      case 'rating': return l.sort((a,b)=>(b.rating||0)-(a.rating||0));
      case 'nearby': return l;
      case 'popular': return l.sort((a,b)=>(b.reviews||0)-(a.reviews||0));
      case 'delivery': return l.sort((a,b)=>(a.deliveryFrom||0)-(b.deliveryFrom||0));
      case 'fast': return l.sort((a,b)=>(a.timeMin||0)-(b.timeMin||0));
      case 'new': return l.sort((a,b)=>(b.new?1:0)-(a.new?1:0));
      case 'offers': return l.sort((a,b)=>(Products.hasOffer(b.id)?1:0)-(Products.hasOffer(a.id)?1:0));
      default: return l;
    }
  }
  function search(q){
    // ✅ Filtra por la zona seleccionada
    const colony = App.state.location.colony;
    const businesses = DB.get('businesses').filter(b =>
      b.status === 'approved' && b.colony === colony &&
      (b.name.toLowerCase().includes(q) || (b.description||'').toLowerCase().includes(q))
    );
    const bizIds = businesses.map(b => b.id);
    const products = DB.get('products').filter(p =>
      p.active && bizIds.includes(p.businessId) &&
      (p.name.toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q))
    );
    const categories = DB.get('categories').filter(c => c.name.toLowerCase().includes(q));
    return { businesses, products, categories };
  }
  function renderSearch(container, q){
    const { businesses, products, categories } = search(q);
    if(!businesses.length && !products.length && !categories.length){
      container.innerHTML = `<div class="empty"><span class="emoji">😕</span><h3>Sin resultados</h3><p>Intenta otra palabra en ${esc(App.state.location.colony)}</p></div>`;
      return;
    }
    let html = '';
    if(categories.length){
      html += `<div class="group-title">📂 Categorías</div><div class="cat-grid" style="grid-template-columns:repeat(4,1fr);padding:0 16px">`;
      html += categories.map(c=>`<div class="cat-card" data-cat="${esc(c.id)}"><span class="emoji">${esc(c.emoji)}</span><small>${esc(c.name)}</small></div>`).join('');
      html += `</div>`;
    }
    if(businesses.length){
      html += `<div class="group-title">🏪 Negocios</div>`;
      html += businesses.map(Views.bizRow).join('');
    }
    if(products.length){
      html += `<div class="group-title">🍽️ Productos</div>`;
      html += products.map(p=>{
        const b = DB.get('businesses').find(x=>x.id===p.businessId);
        const safeImg = safeUrl(p.image);
        return `
          <div class="product" data-open-product="${esc(p.id)}">
            <div class="product-img ${safeImg?'real-img':''}" style="${safeImg ? `background-image:url(${safeImg});` : ''}">${safeImg ? '' : esc(p.emoji || '🍽️')}</div>
            <div class="product-info">
              <h4>${esc(p.name)}</h4>
              <p>${esc(p.desc)} · ${esc(b?.name || '')}</p>
              <div class="product-bottom">
                <strong>${money(p.price)}</strong>
                <button class="add-btn" data-add="${esc(p.id)}">+</button>
              </div>
            </div>
          </div>`;
      }).join('');
    }
    container.innerHTML = html;
  }
  return { sort, search, renderSearch };
})();
